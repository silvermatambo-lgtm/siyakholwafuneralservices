name: Publish uploaded Siyakholwa website package

on:
  push:
    paths:
      - site.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Extract reviewed website package
        shell: bash
        run: |
          set -euo pipefail
          test -f site.zip
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import shutil
          temp = Path("_site_extract")
          with ZipFile("site.zip") as z:
              files = z.infolist()
              if not files or len(files)>500:
                  raise SystemExit("Invalid website archive")
              for item in files:
                  path = Path(item.filename)
                  if path.is_absolute() or '..' in path.parts or path.parts[0] == '.github':
                      raise SystemExit("Unsafe archive entry: " + item.filename)
              z.extractall(temp)
          if not (temp/"index.html").is_file() or not (temp/"manifest.webmanifest").is_file():
              raise SystemExit("The ZIP must have index.html and manifest.webmanifest at its root")
          for f in temp.rglob("*"):
              if not f.is_file():
                  continue
              target = Path(*f.relative_to(temp).parts)
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(f,target)
          shutil.rmtree(temp)
          PY
      - name: Commit website files to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Deploy Siyakholwa UltraMax 7 Pro website files"
            git push
          fi
